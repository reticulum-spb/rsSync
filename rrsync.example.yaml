# Save as config.yaml inside the directory selected by --config (default ~/.rsSync).
# The persistent private key is stored beside it as identity.

# Omit to use the existing rnsd-rs default configuration directory.
# reticulum_config: /home/user/.rsReticulum

timeout_seconds: 600
announce_seconds: 600

permits:
  # - "0123456789abcdef0123456789abcdef": full
  # - "fedcba9876543210fedcba9876543210": read
  - others: deny

# Optional chunk resume. Client protocol defaults to 1; configure resume on both
# peers and select protocol: 2 on the client. Server then accepts both versions.
# Chunk size has no default: 1 MiB below is an example, not a tuned recommendation.
# protocol: 2
# resume:
#   chunk_size: 1048576
#   directory: transfers  # relative to this configuration directory; outside export
#   max_bytes: 536870912
#   max_transfers: 128
#   retention_seconds: 604800  # 7 days; 0 disables cleanup of inactive transfers

# Optional automatic session reconnect, only with outgoing protocol: 2.
# Attempts are additional sessions; default 0 disables automatic retry.
# reconnect:
#   attempts: 3
#   delay_seconds: 5
#   max_delay_seconds: 60
#   max_elapsed_seconds: 3600  # initial attempt, waits and retries combined
